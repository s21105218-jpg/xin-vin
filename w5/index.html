<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端心電感應 | 多人默契遊戲</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 設置 Tailwind 莫蘭迪色系與 Notion 風格字體 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            notion: { bg: '#F7F6F3', text: '#37352F', border: '#E9E9E7' },
            morandi: { blue: '#8a9fa8', green: '#a4b4a1', rose: '#c7b3b3', gray: '#d2d1cb', dark: '#5a6266' }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    
    body { background-color: #F7F6F3; color: #37352F; }
    
    /* 3D 翻牌動畫 CSS */
    .perspective { perspective: 1000px; }
    .card-inner {
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
      width: 100%;
      height: 100%;
    }
    .flipped .card-inner { transform: rotateY(180deg); }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card-back { transform: rotateY(180deg); }
    
    /* Notion 風格輸入框 */
    .notion-input {
      background: transparent; border: none; border-bottom: 2px solid #d2d1cb;
      outline: none; padding: 4px 8px; font-size: 1rem; transition: border-color 0.2s;
    }
    .notion-input:focus { border-color: #8a9fa8; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- 導覽列 -->
  <header class="w-full px-6 py-4 flex justify-between items-center border-b border-notion-border bg-white shadow-sm">
    <div class="text-xl font-bold text-morandi-dark flex items-center">
      🧠 雲端心電感應
      <!-- 隱藏的房主控制台開關 (點擊小圓點展開) -->
      <span id="secret-host-btn" class="ml-2 text-transparent hover:text-gray-300 cursor-pointer select-none text-xs">●</span>
    </div>
    <div id="room-display" class="hidden text-sm font-medium text-gray-500 bg-notion-bg px-3 py-1 rounded-md">
      房間代碼：<span id="display-room-code" class="text-morandi-blue font-bold"></span>
    </div>
  </header>

  <main class="flex-grow flex flex-col items-center p-6 w-full max-w-5xl mx-auto">
    
    <!-- 登入與分組大廳介面 -->
    <section id="login-screen" class="mt-20 w-full max-w-md bg-white p-8 rounded-xl shadow-sm border border-notion-border text-center">
      <h2 class="text-2xl font-bold mb-6 text-morandi-dark">加入遊戲</h2>
      <div class="flex flex-col gap-4">
        <input type="text" id="join-room" placeholder="輸入房間代碼 (例: 101)" class="notion-input w-full text-center">
        <input type="text" id="join-name" placeholder="輸入你的暱稱" class="notion-input w-full text-center">
        <button onclick="joinGame()" class="mt-4 bg-morandi-blue hover:bg-morandi-dark text-white font-medium py-2 rounded-lg transition-colors shadow-sm">
          進入房間
        </button>
      </div>
    </section>

    <!-- 遊戲主介面 -->
    <section id="game-screen" class="hidden w-full flex flex-col items-center">
      
      <!-- 隱藏版房主控制台 -->
      <div id="host-controls" class="hidden w-full max-w-2xl bg-morandi-rose bg-opacity-20 border border-morandi-rose p-4 rounded-lg mb-6 shadow-sm">
        <h3 class="text-sm font-bold text-morandi-dark mb-3 flex items-center">👑 房主專屬控制台</h3>
        <div class="flex gap-2 mb-2">
          <input type="text" id="host-question" placeholder="輸入題目..." class="notion-input flex-grow bg-white rounded">
          <button onclick="sendAction('set_question')" class="bg-morandi-green text-white px-4 py-1 rounded shadow-sm hover:opacity-80 transition">發布題目</button>
        </div>
        <div class="flex gap-2 justify-end">
          <button onclick="sendAction('reveal')" class="bg-morandi-blue text-white px-4 py-1 rounded shadow-sm hover:opacity-80 transition">掀牌！</button>
          <button onclick="sendAction('reset')" class="bg-gray-400 text-white px-4 py-1 rounded shadow-sm hover:opacity-80 transition">重置回合</button>
        </div>
      </div>

      <!-- 題目與玩家輸入區 -->
      <div class="w-full max-w-2xl bg-white p-6 rounded-xl border border-notion-border shadow-sm text-center mb-8">
        <h2 class="text-sm text-gray-400 mb-2 font-medium uppercase tracking-wider">目前題目</h2>
        <div id="current-question" class="text-2xl font-bold text-morandi-dark mb-6 min-h-[2rem]">
          等待房主出題...
        </div>

        <div id="answer-section" class="flex flex-col items-center gap-3 hidden">
          <input type="text" id="player-answer" placeholder="寫下你的答案..." class="notion-input w-2/3 text-center text-lg">
          <button onclick="submitAnswer()" class="bg-morandi-dark text-white px-8 py-2 rounded-full hover:bg-morandi-blue transition shadow-md">
            送出答案
          </button>
          <span id="submit-status" class="text-sm text-morandi-green font-medium hidden">答案已送出 ✅</span>
        </div>
      </div>

      <!-- 卡牌顯示區域 -->
      <div id="cards-container" class="flex flex-wrap justify-center gap-6 w-full">
        <!-- 卡牌將由 JS 動態生成 -->
      </div>
    </section>
  </main>

  <script>
    // === 系統參數設定 ===
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx0rSZdED4_beR7ZufZTmPCQH8ab5UIfcFC7mMYMjEWmc0YSMzK2CItrzQDPl2Y_R6j/exec";
    
    let currentRoom = "";
    let currentPlayerName = "";
    let pollInterval = null;

    // === 介面切換與初始化 ===
    function joinGame() {
      const roomInput = document.getElementById('join-room').value.trim();
      const nameInput = document.getElementById('join-name').value.trim();
      
      if (!roomInput || !nameInput) {
        alert("請輸入房間代碼與暱稱！");
        return;
      }
      
      currentRoom = roomInput;
      currentPlayerName = nameInput;
      
      // 切換 UI
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('room-display').classList.remove('hidden');
      document.getElementById('display-room-code').textContent = currentRoom;
      
      // 啟動輪詢 (每 2 秒抓取一次)
      fetchGameState();
      pollInterval = setInterval(fetchGameState, 2000);
    }

    // 隱藏房主開關事件綁定
    document.getElementById('secret-host-btn').addEventListener('click', () => {
      const hostPanel = document.getElementById('host-controls');
      hostPanel.classList.toggle('hidden');
    });

    // === API 串接與狀態更新 ===
    
    // 獲取房間狀態 (GET)
    async function fetchGameState() {
      try {
        const response = await fetch(`${GAS_API_URL}?room=${currentRoom}`);
        const data = await response.json();
        updateUI(data);
      } catch (error) {
        console.error("狀態更新失敗", error);
      }
    }

    // 發送動作至 GAS (POST)
    async function sendAction(actionType) {
      let payload = { room: currentRoom, action: actionType };
      
      if (actionType === 'set_question') {
        payload.question = document.getElementById('host-question').value;
      } else if (actionType === 'submit_answer') {
        const ans = document.getElementById('player-answer').value.trim();
        if (!ans) return;
        payload.playerName = currentPlayerName;
        payload.answer = ans;
        
        document.getElementById('submit-status').classList.remove('hidden');
        setTimeout(() => document.getElementById('submit-status').classList.add('hidden'), 3000);
      }

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' } // GAS 建議使用 text/plain 避免 CORS preflight
        });
        fetchGameState(); // 送出後立即刷新
      } catch (error) {
        console.error("發送失敗", error);
      }
    }

    // 玩家送出答案的封裝函數
    function submitAnswer() {
      sendAction('submit_answer');
    }

    // === 動態渲染 UI ===
    function updateUI(data) {
      // 1. 更新題目文字
      const qText = data.question ? data.question : "等待房主出題...";
      document.getElementById('current-question').textContent = qText;

      // 2. 依照遊戲狀態控制玩家輸入區
      const answerSection = document.getElementById('answer-section');
      const answerInput = document.getElementById('player-answer');
      
      if (data.status === 'setup') {
        answerSection.classList.add('hidden');
        answerInput.value = ""; // 清空上局答案
      } else if (data.status === 'playing') {
        answerSection.classList.remove('hidden');
        answerInput.disabled = false;
      } else if (data.status === 'revealed') {
        answerSection.classList.remove('hidden');
        answerInput.disabled = true;
      }

      // 3. 更新與繪製卡牌
      const container = document.getElementById('cards-container');
      const currentPlayers = Object.keys(data.answers || {});

      // 移除已不在資料庫中的卡牌 (因重置時答案會清空)
      Array.from(container.children).forEach(child => {
        if (!currentPlayers.includes(child.dataset.player)) {
          container.removeChild(child);
        }
      });

      // 新增或更新卡牌
      currentPlayers.forEach(player => {
        let card = document.getElementById(`card-${player}`);
        
        if (!card) {
          // 建立新卡牌
          card = document.createElement('div');
          card.id = `card-${player}`;
          card.dataset.player = player;
          card.className = "perspective w-40 h-56 m-2 cursor-default";
          card.innerHTML = `
            <div class="card-inner shadow-md rounded-xl">
              <!-- 正面：顯示玩家名字與狀態 -->
              <div class="card-front border border-notion-border transition-colors">
                <div class="text-xl font-bold text-notion-text mb-2">${player}</div>
                <div class="status-badge text-sm px-3 py-1 rounded-full bg-white text-gray-500 shadow-sm">
                  思考中...
                </div>
              </div>
              <!-- 背面：顯示實際答案 -->
              <div class="card-back bg-morandi-blue text-white shadow-lg border border-morandi-blue">
                <div class="text-xs opacity-80 mb-2">${player} 的答案</div>
                <div class="text-2xl font-bold answer-text break-words text-center w-full px-2"></div>
              </div>
            </div>
          `;
          container.appendChild(card);
        }

        // 綁定 DOM
        const answerTextEl = card.querySelector('.answer-text');
        const frontEl = card.querySelector('.card-front');
        const statusEl = card.querySelector('.status-badge');
        
        // 更新卡牌資訊與樣式
        answerTextEl.textContent = data.answers[player];
        
        if (data.answers[player]) {
          statusEl.textContent = "已填答 ✅";
          statusEl.classList.add('text-morandi-green', 'font-bold');
          frontEl.classList.add('bg-morandi-gray');
          frontEl.classList.remove('bg-white');
        }

        // 4. 判斷是否全體翻牌 (3D 動畫觸發)
        if (data.status === 'revealed') {
          card.classList.add('flipped');
        } else {
          card.classList.remove('flipped');
        }
      });
    }
  </script>
</body>
</html>
