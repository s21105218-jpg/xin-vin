<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網頁程式作品集 | Web Development Journey</title>
    <!-- Google Fonts: Noto Sans TC & Outfit for standard Muji aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Cream Yellow & Muji Earthy Color Palette */
            --bg-main: #FAF6ED;         /* Cream soft background */
            --bg-card: #FFFFFF;         /* Pure white card background */
            --bg-card-locked: #F2EFE9;  /* Muted greyish beige for locked */
            --accent-cream: #F8E8C8;    /* Muted butter yellow */
            --accent-warm: #E6A15C;     /* Warm wooden orange tint */
            --accent-green: #8AA888;    /* Soft sage green accent for unlocked status */
            
            --text-primary: #3D3B37;    /* Deep charcoal black */
            --text-secondary: #7A766F;  /* Warm grey description */
            --text-muted: #A39E93;      /* Muted locked text */
            
            --border-color: #EAE5D9;    /* Subtle soft border */
            --border-hover: #D8CEB9;    /* Slightly darker hover border */
            
            --shadow-sm: 0 2px 8px rgba(61, 59, 55, 0.04);
            --shadow-md: 0 6px 16px rgba(61, 59, 55, 0.07);
            --shadow-lg: 0 12px 28px rgba(61, 59, 55, 0.1);
            
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
            
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1.25rem 4rem;
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(rgba(216, 206, 185, 0.25) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .container {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
        }

        .profile-card {
            background-color: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            animation: fadeInDown 0.8s ease-out;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #F5D7A1 0%, #E6A15C 50%, #8AA888 100%);
        }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.2rem;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: var(--radius-full);
            object-fit: cover;
            border: 4px solid var(--bg-card);
            box-shadow: 0 0 0 2px var(--accent-cream), var(--shadow-md);
            transition: var(--transition-bounce);
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.05) rotate(3deg);
        }

        .user-name {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }

        .user-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .badge {
            background-color: var(--accent-cream);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.65rem;
            border-radius: var(--radius-full);
            letter-spacing: 0.03em;
        }

        .progress-box {
            background-color: var(--bg-main);
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            max-width: 420px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .progress-bar-bg {
            height: 8px;
            background-color: var(--border-color);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 31.25%; /* 5 out of 16 */
            background: linear-gradient(90deg, #E6A15C, #8AA888);
            border-radius: var(--radius-full);
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
            animation: fadeInUp 0.8s ease-out 0.2s backwards;
        }

        /* Card base structure */
        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            position: relative;
            transition: var(--transition-bounce);
            box-shadow: var(--shadow-sm);
            user-select: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .week-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            background-color: var(--bg-main);
            padding: 0.25rem 0.55rem;
            border-radius: 6px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Unlocked Card Styling */
        .card.unlocked {
            border-color: #E2D7BE;
        }

        .card.unlocked .week-tag {
            background-color: #F8E8C8;
            color: #725217;
